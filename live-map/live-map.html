<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Live Map — Admin</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="live-map.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <span>LOCO BUS</span>
      <div id="busLogoAnim" class="bus-logo"></div>
    </div> 
    
    <nav class="menu">

    <a class="menu-item" href="../index.html">
        <span class="menu-icon"><i class="fa-solid fa-gauge"></i></span>
        <span class="menu-text">Dashboard</span>
    </a>

    <a class="menu-item active" href="../live-map/live-map.html">
        <span class="menu-icon"><i class="fa-solid fa-map-location-dot"></i></span>
        <span class="menu-text">Live Map</span>
    </a>

    <a class="menu-item" href="../fleet/fleet.html">
        <span class="menu-icon"><i class="fa-solid fa-bus"></i></span>
        <span class="menu-text">Fleet Management</span>
    </a>

    <a class="menu-item" href="../broadCasts/broadCasts.html">
        <span class="menu-icon"><i class="fa-solid fa-bullhorn"></i></span>
        <span class="menu-text">Broadcasts</span>
    </a>

    <a class="menu-item" href="../notifications/notifications.html">
        <span class="menu-icon"><i class="fa-solid fa-bell"></i></span>
        <span class="menu-text">Notifications</span>
    </a>

    <a class="menu-item" href="../index/createBus.html">
        <span class="menu-icon"><i class="fa-solid fa-user-gear"></i></span>
        <span class="menu-text">Account Panel</span>
    </a>

    <a class="menu-item" href="../help desk/helpDesk.html">
        <span class="menu-icon"><i class="fa-solid fa-circle-info"></i></span>
        <span class="menu-text">Help Desk</span>
    </a>

    <a class="menu-item" href="../live-map/addroute.html">
        <span class="menu-icon"><i class="fa-solid fa-file-import"></i></span>
        <span class="menu-text">Route Importer</span>
    </a>

    <a class="menu-item" href="../settings/settings.html">
        <span class="menu-icon"><i class="fa-solid fa-gear"></i></span>
        <span class="menu-text">Settings</span>
    </a>

</nav>
    <div class="admin-profile">
      <img src="admin img.png" class="admin-icon" />
      <span>ADMIN2</span>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="main-content">
    
    <!-- Top Route Bar -->
    <div class="route-bar">
      <div class="route-bar-header">
        <h3 class="route-bar-title">
          <span class="route-icon">🗺️</span>
          Active Routes
        </h3>
        
        <!-- Search Input -->
        <div class="search-container">
          <input 
            type="text" 
            id="routeSearch" 
            class="route-search" 
            placeholder="Search routes by name or number..." 
          />
          <span class="search-icon">🔍</span>
        </div>
      </div>

      <!-- Route Cards Container (Horizontal Scroll) -->
      <div class="route-cards-wrapper">
        <button class="nav-btn nav-prev" id="navPrev" disabled>
          <span>←</span>
        </button>
        
        <div class="route-cards-container" id="routeCardsContainer">
          <!-- Route cards will be dynamically inserted here -->
          <div class="route-card-loading">
            <span class="loading-spinner">⏳</span>
            Loading routes...
          </div>
        </div>
        
        <button class="nav-btn nav-next" id="navNext">
          <span>→</span>
        </button>
      </div>

      <!-- Pagination Info -->
      <div class="pagination-info">
        <span id="paginationText">No routes loaded</span>
      </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
<script type="module" src="live-map.js"></script>
</body>
</html>

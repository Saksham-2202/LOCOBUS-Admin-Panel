<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Live Map — Admin (Real-time)</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="live-map.css" />
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand">LOC🅱️BUS</div>
    </div>

    <nav class="menu">
      <a class="menu-item" href="../index/index.html">Dashboard</a>
      <a class="menu-item active" href="../live-map/live-map.html">Live Map</a>
      <a class="menu-item" href="../fleet/fleet.html">Fleet Management</a>
      <a class="menu-item" href="../broadCasts/broadCasts.html">Broadcasts</a>
      <a class="menu-item" href="../notifications/notifications.html">Notifications</a>
      <a class="menu-item" href="../help desk/helpDesk.html">Help Desk</a>
      <a class="menu-item" href="../settings/settings.html">Settings</a>
    </nav>

    <div class="controls">
      <button id="fitAll" class="btn">Fit All</button>
      <button id="toggleSim" class="btn">Test Mode</button>
    </div>

    <div class="bus-list" id="list">
      <div style="padding: 15px; color: #666; font-size: 14px;">
        <span id="loadingStatus">Connecting to Firebase...</span>
      </div>
    </div>
  </aside>

  <div class="admin-profile">
    <img src="admin img.png" class="admin-icon" />
    ADMIN_33
  </div>

  <div id="map"></div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCRtx7Oyda48Hz0eu-BiNrGYiK3_36Vl-c",
      authDomain: "locobus-e4274.firebaseapp.com",
      databaseURL: "https://locobus-e4274-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "locobus-e4274",
      storageBucket: "locobus-e4274.firebasestorage.app",
      messagingSenderId: "296482389648",
      appId: "1:296482389648:web:1827bd92dc55c8a857e215"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Basic Leaflet load check
    if (typeof L === 'undefined') {
      document.body.innerHTML = '<div style="padding:20px;">Leaflet failed to load. Check your internet or CDN.</div>';
      throw new Error('Leaflet not loaded');
    }

    // Create map centered on Punjab (Chandigarh/Amritsar region)
    const map = L.map('map', { zoomControl: true }).setView([30.9010, 75.8573], 8);

    // OSM tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Keep buses in a Map
    const buses = new Map();
    let isTestMode = false;
    let testInterval = null;

    // Safe escapeHtml
    function escapeHtml(str) {
      if (str === undefined || str === null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Make a DivIcon for a bus
    function makeIcon(data) {
      const status = (data.status || '').toLowerCase();
      const cls = status === 'idle' ? 'marker-idle' : (status === 'delayed' ? 'marker-delayed' : 'marker-running');
      const content = '<div class="bus-marker ' + cls + '">' + escapeHtml(data.number || 'BUS') + '</div>';
      return L.divIcon({ 
        html: content, 
        className: '', 
        iconSize: [48, 28], 
        iconAnchor: [24, 14] 
      });
    }

    // Add or update bus marker
    function upsertBus(id, data) {
      if (typeof data.lat !== 'number' || typeof data.lng !== 'number') return;
      
      const existing = buses.get(id);
      if (!existing) {
        // Create new marker
        const marker = L.marker([data.lat, data.lng], { icon: makeIcon(data) }).addTo(map);
        marker.on('click', () => showDetails(id));
        buses.set(id, { marker: marker, data: Object.assign({}, data) });
        addListItem(id, data);
      } else {
        // Update existing marker
        const from = existing.data;
        const to = Object.assign({}, existing.data, data);
        existing.data = to;
        
        if (from.status !== to.status || from.number !== to.number) {
          existing.marker.setIcon(makeIcon(to));
        }
        
        animateMarker(existing.marker, [from.lat, from.lng], [to.lat, to.lng]);
        updateListItem(id, to);
      }
    }

    // Remove bus marker
    function removeBus(id) {
      const existing = buses.get(id);
      if (existing) {
        map.removeLayer(existing.marker);
        buses.delete(id);
        removeListItem(id);
      }
    }

    // Animate marker between two points
    function animateMarker(marker, fromLatLng, toLatLng, duration = 1000) {
      const start = performance.now();
      function step(now) {
        const t = Math.min(1, (now - start) / duration);
        const eased = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        const lat = fromLatLng[0] + (toLatLng[0] - fromLatLng[0]) * eased;
        const lng = fromLatLng[1] + (toLatLng[1] - fromLatLng[1]) * eased;
        marker.setLatLng([lat, lng]);
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    // Sidebar helpers
    const listEl = document.getElementById('list');
    const loadingStatus = document.getElementById('loadingStatus');

    function addListItem(id, data) {
      const el = document.createElement('div');
      el.id = 'bus-' + id;
      el.className = 'bus-card';
      el.innerHTML = ''
        + '<div style="width:10px;height:10px;background:' + statusColor(data.status) + ';border-radius:50%"></div>'
        + '<div class="bus-info"><div>' + escapeHtml(data.number || id) + '</div>'
        + '<div class="bus-sub">' + escapeHtml(data.route || 'Route not set') + '</div></div>'
        + '<div style="font-weight:700">' + formatSpeed(data.speed) + '</div>';
      el.addEventListener('click', function() {
        const entry = buses.get(id);
        if (entry) map.flyTo([entry.data.lat, entry.data.lng], 15);
      });
      listEl.appendChild(el);
    }

    function updateListItem(id, data) {
      const el = document.getElementById('bus-' + id);
      if (!el) return;
      el.innerHTML = ''
        + '<div style="width:10px;height:10px;background:' + statusColor(data.status) + ';border-radius:50%"></div>'
        + '<div class="bus-info"><div>' + escapeHtml(data.number || id) + '</div>'
        + '<div class="bus-sub">' + escapeHtml(data.route || 'Route not set') + '</div></div>'
        + '<div style="font-weight:700">' + formatSpeed(data.speed) + '</div>';
    }

    function removeListItem(id) {
      const el = document.getElementById('bus-' + id);
      if (el) el.remove();
    }

    function statusColor(s) {
      switch ((s || '').toLowerCase()) {
        case 'running': return '#10b981';
        case 'idle': return '#f59e0b';
        case 'delayed': return '#ef4444';
        case 'active': return '#10b981';
        default: return '#9ca3af';
      }
    }

    function formatSpeed(v) { 
      return v == null ? '-' : Math.round(v) + ' km/h'; 
    }

    function showDetails(id) {
      const entry = buses.get(id);
      if (!entry) return;
      const d = entry.data;
      alert('Bus ' + (d.number || id) + 
            '\nRoute: ' + (d.route || '-') + 
            '\nSpeed: ' + formatSpeed(d.speed) + 
            '\nStatus: ' + (d.status || 'unknown') +
            '\nLast updated: ' + new Date(d.timestamp || Date.now()).toLocaleString());
    }

    // Firebase Real-time Listener
    function startFirebaseListener() {
      const busesRef = collection(db, 'buses');
      
      onSnapshot(busesRef, (snapshot) => {
        console.log('=== Firebase Snapshot ===');
        console.log('Total buses in Firebase:', snapshot.size);
        
        // Track which buses are in the snapshot
        const activeBusIds = new Set();
        
        snapshot.forEach((doc) => {
          const busData = doc.data();
          const busId = doc.id;
          
          console.log(`Bus ${busId}:`, {
            hasLiveStatus: !!busData.liveStatus,
            status: busData.liveStatus?.status,
            hasLocation: !!busData.liveStatus?.location,
            lat: busData.liveStatus?.location?.latitude,
            lng: busData.liveStatus?.location?.longitude,
            fullData: busData
          });
          
          activeBusIds.add(busId);
          
          // Check if bus has liveStatus
          if (!busData.liveStatus) {
            console.log('✗ No liveStatus for bus:', busId);
            removeBus(busId);
            return;
          }
          
          // Check multiple possible status locations
          const statusFromLiveStatus = busData.liveStatus.status;
          const statusFromLocation = busData.liveStatus.liveLocation?.status;
          const busIsActive = statusFromLiveStatus === 'active' || statusFromLocation === 'active';
          
          console.log(`Bus ${busId} status check:`, {
            liveStatus: statusFromLiveStatus,
            locationStatus: statusFromLocation,
            isActive: busIsActive
          });
          
          // Check if bus is active and has location data
          if (busIsActive) {
            const location = busData.liveStatus.liveLocation;
            
            // Handle different location formats
            let lat = null;
            let lng = null;
            
            if (location) {
              console.log(`Raw location data for ${busId}:`, JSON.stringify(location, null, 2));
              
              // Check if coordinates array exists
              if (location.coordinates && Array.isArray(location.coordinates) && location.coordinates.length >= 2) {
                console.log(`Coordinates array found for ${busId}:`, location.coordinates);
                
                // Parse coordinates - extract all numbers from the string
                const coord0 = String(location.coordinates[0]);
                const coord1 = String(location.coordinates[1]);
                
                // Extract just the number part (before any special characters)
                const latMatch = coord0.match(/[\d.]+/);
                const lngMatch = coord1.match(/[\d.]+/);
                
                console.log(`Regex matches for ${busId}:`, { latMatch, lngMatch });
                
                if (latMatch && lngMatch) {
                  lat = parseFloat(latMatch[0]);
                  lng = parseFloat(lngMatch[0]);
                  
                  console.log(`Float values for ${busId}:`, { lat, lng, latIsNaN: isNaN(lat), lngIsNaN: isNaN(lng) });
                  
                  // Handle negative coordinates for S and W
                  if (coord0.toUpperCase().includes('S')) lat = -lat;
                  if (coord1.toUpperCase().includes('W')) lng = -lng;
                  
                  console.log(`Final coordinates for ${busId}:`, { lat, lng });
                } else {
                  console.log(`Could not extract numbers from coordinates for ${busId}`);
                }
              }
              // Also check for latitude/longitude fields
              else if (location.latitude && location.longitude) {
                lat = parseFloat(location.latitude);
                lng = parseFloat(location.longitude);
                console.log(`Using latitude/longitude fields for ${busId}:`, { lat, lng });
              }
              // Check for lat/lng fields
              else if (location.lat && location.lng) {
                lat = parseFloat(location.lat);
                lng = parseFloat(location.lng);
                console.log(`Using lat/lng fields for ${busId}:`, { lat, lng });
              }
              else {
                console.log(`No valid coordinate format found for ${busId}`, location);
              }
            } else {
              console.log(`Location is null/undefined for ${busId}`);
            }
            
            if (lat && lng && !isNaN(lat) && !isNaN(lng)) {
              // Prepare bus data for map
              const mapData = {
                lat: lat,
                lng: lng,
                number: busData.busNumber || busId,
                route: busData.routeInfo?.routeNumber || busData.routeInfo?.routeName || busData.routeInfo?.from || 'Unknown Route',
                speed: location?.speed || 0,
                status: statusFromLocation || statusFromLiveStatus || 'active',
                timestamp: location?.lastUpdate || Date.now()
              };
              
              console.log('✓ Adding bus to map:', busId, mapData);
              upsertBus(busId, mapData);
            } else {
              console.log('✗ Bus is active but invalid location data:', busId, { 
                location, 
                parsed: { lat, lng },
                locationExists: !!location,
                hasCoordinates: !!(location?.coordinates)
              });
            }
          } else {
            console.log('✗ Bus is not active:', busId, { statusFromLiveStatus, statusFromLocation });
            // Bus is inactive, remove from map
            removeBus(busId);
          }
        });
        
        // Remove buses that are no longer in Firebase
        buses.forEach((value, busId) => {
          if (!activeBusIds.has(busId) && !isTestMode) {
            removeBus(busId);
          }
        });
        
        // Update status
        if (loadingStatus) {
          const activeCount = buses.size;
          loadingStatus.textContent = activeCount === 0 
            ? 'No active buses' 
            : `${activeCount} active bus${activeCount !== 1 ? 'es' : ''}`;
          loadingStatus.style.color = activeCount > 0 ? '#10b981' : '#666';
        }
        
        console.log('Buses on map:', buses.size);
        console.log('======================');
        
      }, (error) => {
        console.error('Firebase listener error:', error);
        if (loadingStatus) {
          loadingStatus.textContent = 'Connection error';
          loadingStatus.style.color = '#ef4444';
        }
      });
    }

    // Fit All button
    document.getElementById('fitAll').addEventListener('click', function() {
      const coords = [];
      buses.forEach(function(v) { 
        coords.push([v.data.lat, v.data.lng]); 
      });
      
      if (coords.length === 0) {
        alert('No buses on map to fit');
        return;
      }
      
      const bounds = L.latLngBounds(coords);
      map.fitBounds(bounds.pad(0.15));
    });

    // Test Mode (Simulator)
    document.getElementById('toggleSim').addEventListener('click', function() {
      if (testInterval) {
        clearInterval(testInterval);
        testInterval = null;
        isTestMode = false;
        this.innerText = 'Test Mode';
        
        // Clear test buses
        buses.forEach((value, id) => {
          if (id.startsWith('test-')) {
            removeBus(id);
          }
        });
        return;
      }
      
      this.innerText = 'Stop Test';
      isTestMode = true;
      
      // Create test buses
      upsertBus('test-1', { 
        number: 'TEST-101', 
        route: 'Test Route 1', 
        lat: 28.6139, 
        lng: 77.2090, 
        speed: 30, 
        status: 'running', 
        timestamp: Date.now() 
      });
      
      upsertBus('test-2', { 
        number: 'TEST-102', 
        route: 'Test Route 2', 
        lat: 28.62, 
        lng: 77.20, 
        speed: 25, 
        status: 'running', 
        timestamp: Date.now() 
      });
      
      upsertBus('test-3', { 
        number: 'TEST-103', 
        route: 'Test Route 3', 
        lat: 28.60, 
        lng: 77.22, 
        speed: 0, 
        status: 'idle', 
        timestamp: Date.now() 
      });

      // Animate test buses
      testInterval = setInterval(function() {
        buses.forEach(function(v, id) {
          if (!id.startsWith('test-')) return;
          
          const jitter = (Math.random() - 0.5) * 0.0016;
          const newLat = v.data.lat + (Math.random() * 0.002 - 0.001) + jitter;
          const newLng = v.data.lng + (Math.random() * 0.002 - 0.001) + jitter;
          const newSpeed = Math.max(0, (v.data.speed || 20) + (Math.random() * 6 - 3));
          
          upsertBus(id, { 
            lat: newLat, 
            lng: newLng, 
            speed: newSpeed, 
            status: newSpeed < 1 ? 'idle' : 'running', 
            timestamp: Date.now(), 
            number: v.data.number, 
            route: v.data.route 
          });
        });
      }, 1600);
    });

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', function() {
      console.log('Initializing live map with Firebase...');
      startFirebaseListener();
    });
  </script>
</body>
</html>

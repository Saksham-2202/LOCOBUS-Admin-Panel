<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bus Sathi | Admin Login</title>
  <link rel="stylesheet" href="./login.css" />
</head>
<body>
      <div class="login-layout">
    <aside class="login-side">
      <div class="brand" class="brand-text">
        <span>LOCO BUS</span>
      <div id="busLogoAnim" class="bus-logo"></div>
      </div> 

      <p class="lead">Admin Panel</p>
      <p class="sub">Sign in to manage fleet, broadcasts, help desk and more.</p>
    </aside>

    <main class="login-main">
      <div class="card login-card">
        <h2>Admin Sign In</h2>

        <div class="form-row">
          <label>Admin ID</label>
          <input id="adminId" type="text" class="input" placeholder="admin1" />
        </div>

        <div class="form-row">
          <label>Password</label>
          <input id="password" type="password" class="input" placeholder="Your password" />
        </div>

        <div class="form-row small muted" id="errMsg" aria-live="polite"></div>

        <div class="form-actions">
          <button id="loginBtn" class="btn-primary">Sign in</button>
          <a href="../index/index.html" class="btn-ghost">Back</a>
        </div>

        <div class="hint">Use your admin credentials provided by the administrator.</div>
      </div>
    </main>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
  <script type="module" src="./login.js"></script>
</body>
</html>
